id: EPIC-05
title: CI and publish
scope: pypi
type: ci
status: READY
description: GitHub Actions workflows — one to run the test suite on every push and PR, one to publish to PyPI on a SemVer tag.
tickets:
  - id: T1
    type: docs
    status: DONE
    title: Package publishing metadata and API documentation
    description: Add README.md, MIT LICENSE, complete pyproject.toml publishing metadata, and Google-format docstrings on all public API symbols — the full developer-experience baseline before the package ships to PyPI.
    ac:
      - README.md covers project badges (PyPI version, Python versions, license, CI status), description, installation (base and spark extra), CLI quick-start, Python API quick-start, and links to source/issues
      - LICENSE is MIT with correct year and author
      - pyproject.toml gains readme, license (SPDX "MIT"), authors, classifiers (Programming Language :: Python :: 3, Operating System :: OS Independent, Topic :: Database :: Database Engines/Servers, License :: OSI Approved :: MIT License), and [project.urls] (Homepage, Source, Issues)
      - All symbols in __all__ (migrate, LakeMigrateError, ChecksumMismatchError, DuplicateVersionError, InvalidFilenameError) have Google-format docstrings with Args/Returns/Raises sections as applicable
      - discover_migrations, run_migrations, and Backend protocol methods have Google-format docstrings (non-trivial operations per project skill)
      - pyright and ruff check still pass after all changes
    notes:
      - MIT license, year 2026, author Nicolas Contreras
      - Use only the generic Programming Language :: Python :: 3 classifier — per-minor classifiers are decorative, pip ignores them, and requires-python = ">=3.10" is the enforced floor
      - README badges link to PyPI (once published) and the GitHub Actions CI workflow on nicobc/lakemigrate
      - Docstrings follow project python skill — Google format, Example section only for non-trivial operations; migrate warrants an Example

  - id: T2
    type: ci
    status: IN PROGRESS
    title: Test workflow
    description: Run the full test suite (unit + integration) on every push and on PRs targeting main. Reports a required status check named "status" to satisfy branch protection.
    ac:
      - Triggers on push to any branch and on pull_request targeting main
      - Java is pre-installed (required for Spark)
      - Both unit tests and integration tests run
      - ruff check and pyright run as part of the workflow
      - Workflow reports a job named "status" (matches branch protection rule)
      - uv dependencies are cached between runs
    notes:
      - Use ubuntu-latest
      - Install Java via actions/setup-java before uv setup
      - Cache the uv virtualenv keyed on pyproject.toml hash

  - id: T3
    type: ci
    status: READY
    title: Publish workflow
    description: Build and publish the package to PyPI when a SemVer tag is pushed to main.
    ac:
      - Triggers on push of tags matching v*.*.* targeting main
      - Publishes using PyPI trusted publishing (OIDC — no API key stored in secrets)
      - Build uses uv
      - Fails loudly if the tag does not point to a commit on main
    notes:
      - Configure trusted publishing on PyPI before wiring the workflow (project must exist there first)
      - SemVer tag format is vMAJOR.MINOR.PATCH per RELEASING.md
