id: EPIC-03
title: Delta lakehouse backend
scope: spark
type: feat
status: DONE
description: The first concrete backend — runs migrations against Delta tables using a SparkSession and tracks applied migrations in a history table stored in Delta format.
tickets:
  - id: T1
    type: feat
    status: DONE
    title: Delta backend
    description: Implement the backend protocol for Delta lakehouse format. The history table is created on first use.
    ac:
      - Class satisfies the backend protocol (pyright confirms)
      - History table is created automatically if it does not exist, in Delta format
      - History table schema — version INT, description STRING, checksum STRING, applied_at TIMESTAMP (set server-side via current_timestamp())
      - History table name is fully qualified (catalog.schema.table) and configurable, defaults to "default.lakemigrate_history"
      - execute() runs arbitrary SQL via spark.sql() — no inspection of user SQL
      - get_applied_migrations() returns a dict mapping version to checksum
      - record_version() appends a row to the history table
      - SparkSession is obtained via getActiveSession() — not passed by the caller
    notes:
      - Iceberg descoped — Delta only for velocity. Iceberg adds JAR management complexity with no pip equivalent.

  - id: T2
    type: test
    status: DONE
    title: Delta backend integration tests
    description: End-to-end test suite that runs the full migration flow against a local Spark + Delta instance.
    ac:
      - Tests run with uv run pytest -m integration
      - Cover Delta format — fresh run, idempotent run, partial run, checksum mismatch error
      - History table is torn down after each test
      - Tests are skipped gracefully if the required packages are not installed
    notes:
      - Use a session-scoped pytest fixture for the SparkSession (startup is slow)
      - Use a unique table name per test to avoid collisions
      - Mark with pytest.mark.integration so unit tests can run without Spark
