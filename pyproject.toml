[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lakemigrate"
version = "0.1.0"
description = "Ordered SQL migrations with a version table for lakehouse storage"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
spark = [
    "pyspark>=3.3",
    "delta-spark>=2.3",
]

[project.scripts]
lakemigrate = "lakemigrate._cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyright>=1.1",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lakemigrate"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
markers = [
    "integration: marks tests requiring Spark (deselect with -m 'not integration')",
]
